<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>Camera calibration checkerboard: 20 mm squares, 7 x 10 inner corners</title>
  <desc>Print on A4 at 100 percent / actual size. Do not fit to page.</desc>

  <defs>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="#000000"/>
      <rect x="20" y="20" width="20" height="20" fill="#000000"/>
    </pattern>
  </defs>

  <rect width="210" height="297" fill="#ffffff"/>

  <!-- 8 x 11 squares = 7 x 10 inner corners; physical board 160 x 220 mm. -->
  <rect x="25" y="18" width="160" height="220" fill="url(#checker)"/>

  <!-- Print-quality and scale checks, outside the calibration board. -->
  <rect x="25" y="248" width="30" height="12" fill="#000000"/>
  <text x="60" y="257" font-family="sans-serif" font-size="4" fill="#000000">
    黒ベタ確認
  </text>

  <line x1="25" y1="275" x2="125" y2="275" stroke="#000000" stroke-width="0.5"/>
  <line x1="25" y1="272" x2="25" y2="278" stroke="#000000" stroke-width="0.5"/>
  <line x1="125" y1="272" x2="125" y2="278" stroke="#000000" stroke-width="0.5"/>
  <text x="67" y="270" font-family="sans-serif" font-size="4" fill="#000000">
    100 mm
  </text>
  <text x="25" y="288" font-family="sans-serif" font-size="3.5" fill="#000000">
    A4・実際のサイズ (100%)・ページに合わせない・20 mm squares・7 x 10 inner corners
  </text>
</svg>
