vision_turn_controller:
  ros__parameters:
    use_sim_time: true
    # Both flags must remain false until image pixels and odom coordinates are calibrated.
    control_enabled: false
    calibration_ready: false
    dry_run_enabled: false

    # Simulation map_frame_adapter and future ArUco both provide PoseStamped in map.
    pose_source: pose_stamped
    pose_topic: /robot/pose

    detections_topic: /webcam/detections
    cmd_vel_topic: /cmd_vel_unstamped
    dry_run_cmd_vel_topic: /nav/cmd_vel_unstamped
    target_label: litter
    detection_target_frame: odom
    detection_target_topic: /litter/target_candidate_odom
    target_frame: map
    candidate_target_topic: /litter/target_candidate
    target_topic: /litter/target
    decision_topic: /litter/target_decision
    target_marker_topic: /litter/target_marker
    reached_topic: /litter/reached

    # Row-major 3x3 image-pixel -> odom-plane homography. Identity is a placeholder.
    image_to_odom_homography: [-5.001767485e-05, -0.002576239006, 3.069992876, -0.002449167262, -7.636387191e-05, 1.684634773, 1.961929643e-05, 0.0005567604169, 1.0]
    calibration_image_width: 1280
    calibration_image_height: 960
    angular_gain: 1.2
    max_angular_speed: 0.8
    angle_tolerance: 0.08
    arrival_distance: 0.15
    arrival_epsilon: 0.0
    input_timeout: 1.0
    # Stage-1 safety guard. Targets this close to the robot are rejected in map.
    robot_guard_radius: 0.5  # metres
    max_robot_pose_age: 1.0  # seconds

    # Start with rotation only. Change to approach only after turn_only is verified.
    control_mode: turn_only
    linear_gain: 0.4
    max_linear_speed: 0.08
    forward_angle_tolerance: 0.15
