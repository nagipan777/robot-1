wheel_odometry:
  ros__parameters:
    # Observation-only feature. No TF and no Navigation input are published.
    odometry_enabled: false
    preview_enabled: false
    input_topic: /roomba/encoder_counts
    output_topic: /roomba/odom
    aruco_topic: /robot/pose
    frame_id: roomba_odom
    child_frame_id: roomba_base_link
    csv_path: ""
    encoder_counts_per_rev: 508.8
    wheel_diameter_m: 0.072
    wheel_separation_m: 0.235
    max_tick_delta: 2000
