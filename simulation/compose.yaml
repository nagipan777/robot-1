name: robot-create3
services:
  simulator:
    build: .
    image: robot-create3:jazzy-harmonic
    platform: linux/arm64
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:8766:8766"
    shm_size: 512m
    environment:
      ROS_DOMAIN_ID: "33"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      # Fast DDS SHM port locks are unreliable under Colima. All ROS nodes in
      # this service share one network namespace, so localhost UDP is enough.
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      SIM_WORLD: "${SIM_WORLD:-room}"
      VISION_CONTROLLER_CONFIG: "${VISION_CONTROLLER_CONFIG:-/etc/vision-controller.yaml}"
      ROBOT_X: "${ROBOT_X:-0.0}"
      ROBOT_Y: "${ROBOT_Y:-0.0}"
      ROBOT_YAW: "${ROBOT_YAW:-0.0}"
      SPAWN_DOCK: "${SPAWN_DOCK:-true}"
    init: true
    stop_grace_period: 20s
