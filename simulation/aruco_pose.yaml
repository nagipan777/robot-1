aruco_pose_publisher:
  ros__parameters:
    detections_topic: /webcam/detections
    candidate_topic: /robot/pose_candidate
    localization_topic: /localization/aruco_pose
    pose_topic: /robot/pose
    status_topic: /robot/pose_status
    map_frame: map
    marker_id: 0
    # Unknown until the printed marker is measured. 0 disables any 3D claim.
    marker_size_m: 0.0
    # Keep false until marker size/height, camera geometry, mount offset and
    # independent validation points are measured and recorded.
    pose_calibration_ready: false
    pose_output_enabled: false
    calibration_image_width: 1280
    calibration_image_height: 960
    image_to_map_homography: [2.271875105e-05, -0.002563034829, 2.924257728, -0.00167332933, 2.362981057e-05, 1.038104632, 3.022370992e-05, 2.631257443e-05, 1.0]
    # Measure these before enabling pose output. Units are metres/radians.
    camera_ground_x: 1.7
    camera_ground_y: 0.1
    camera_height_m:  0.82
    marker_height_m: 0.08
    marker_to_robot_forward_m: 0.0
    marker_to_robot_left_m: 0.0
    marker_yaw_offset_rad: 1.508362
    min_marker_pixel_area: 100.0
    max_pose_age: 0.5
    min_consecutive_detections: 3
    map_bounds: [0.0, 3.0, -1.5, 1.5]
