aruco_pose_publisher:
  ros__parameters:
    detections_topic: /webcam/detections
    candidate_topic: /robot/pose_candidate
    localization_topic: /localization/aruco_pose
    pose_topic: /robot/pose
    status_topic: /robot/pose_status
    map_frame: map
    marker_id: 0
    # Measured black-square outer edge on 2026-10-28.
    marker_size_m: 0.080
    # Geometry passed two independent measured-point checks on 2026-10-28.
    # Authoritative output remains separately locked below.
    pose_calibration_ready: true
    pose_output_enabled: false
    calibration_image_width: 800
    calibration_image_height: 600
    image_to_map_homography: [-0.001470399292974724, 0.0037626294410314717, 5.797794949988258, -0.008284737151183564, -0.0003804983196974422, 3.566416130572197, -0.001447932227919006, 0.017275494400635284, 1.0]
    # Camera-ground projection defines map (0, 0); units are metres/radians.
    camera_ground_x: 0.0
    camera_ground_y: 0.0
    camera_height_m: 0.53
    marker_height_m: 0.12
    marker_to_robot_forward_m: -0.010
    # Marker is measured 0.002 m left of robot centre, so marker-to-robot is right.
    marker_to_robot_left_m: -0.002
    marker_yaw_offset_rad: 1.7016900232085759
    min_marker_pixel_area: 100.0
    max_pose_age: 0.5
    min_consecutive_detections: 3
    map_bounds: [0.0, 3.0, -1.5, 1.5]
