[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord-real-camera-aruco.pid

[unix_http_server]
file=/tmp/supervisor-real-camera-aruco.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor-real-camera-aruco.sock

[program:webcam-bridge]
command=/bin/bash -c "source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/webcam-bridge"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:aruco-pose]
command=/bin/bash -c "source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/aruco-pose-publisher --ros-args --params-file /etc/aruco-pose.yaml"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
