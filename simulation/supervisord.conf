[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
priority=10
autorestart=true

[program:openbox]
command=/usr/bin/openbox
priority=20
autorestart=true
startretries=10

[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900
priority=30
autorestart=true
startretries=10

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
priority=40
autorestart=true

[program:create3]
command=/usr/local/bin/start-simulation
priority=50
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:webcam-bridge]
command=/bin/bash -c "source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/webcam-bridge"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:unstamped-cmd-relay]
command=/bin/bash -c "source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/unstamped-cmd-relay"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:map-frame-adapter]
command=/bin/bash -c "if [ \"$VISION_CONTROLLER_CONFIG\" = /etc/vision-controller.real-dry-run.yaml ] || [ \"$VISION_CONTROLLER_CONFIG\" = /etc/vision-controller.real-aruco-dry-run.yaml ]; then exec sleep infinity; fi; source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/map-frame-adapter --ros-args --params-file /etc/map-frame-adapter.yaml"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vision-turn-controller]
command=/usr/local/bin/start-vision-controller
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:aruco-pose]
command=/bin/bash -c "source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/aruco-pose-publisher --ros-args --params-file /etc/aruco-pose.yaml"
priority=62
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cmd-vel-output-adapter]
command=/bin/bash -c "if [ \"$VISION_CONTROLLER_CONFIG\" != /etc/vision-controller.real-dry-run.yaml ] && [ \"$VISION_CONTROLLER_CONFIG\" != /etc/vision-controller.real-aruco-dry-run.yaml ]; then exec sleep infinity; fi; source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/cmd-vel-output-adapter --ros-args --params-file /etc/cmd-vel-output-adapter.yaml"
priority=65
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dry-run-pose-publisher]
command=/bin/bash -c "if [ \"$VISION_CONTROLLER_CONFIG\" != /etc/vision-controller.real-dry-run.yaml ]; then exec sleep infinity; fi; source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/dry-run-pose-publisher \"$DRY_RUN_ROBOT_X\" \"$DRY_RUN_ROBOT_Y\" \"$DRY_RUN_ROBOT_YAW\""
priority=65
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pico-dry-run-bridge]
command=/bin/bash -c "if [ \"$VISION_CONTROLLER_CONFIG\" != /etc/vision-controller.real-dry-run.yaml ] || [ -z \"$PICO_DRY_RUN_HOST\" ]; then exec sleep infinity; fi; source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/pico-dry-run-bridge --ros-args -p network_enabled:=true -p host:=\"$PICO_DRY_RUN_HOST\" -p port:=\"$PICO_DRY_RUN_PORT\" -p command_topic:=/roomba/cmd_vel_dry_run"
priority=65
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:presentation-visualizer]
command=/bin/bash -c "source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/presentation-visualizer"
priority=70
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

