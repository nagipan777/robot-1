[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
priority=10
autorestart=true

[program:openbox]
command=/usr/bin/openbox
priority=20
autorestart=true
startretries=10

[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900
priority=30
autorestart=true
startretries=10

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
priority=40
autorestart=true

[program:create3]
command=/usr/local/bin/start-simulation
priority=50
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:webcam-bridge]
command=/bin/bash -c "source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/webcam-bridge"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:unstamped-cmd-relay]
command=/bin/bash -c "source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/unstamped-cmd-relay"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vision-turn-controller]
command=/bin/bash -c "source /opt/create3_ws/install/setup.bash; exec /usr/local/bin/vision-turn-controller --ros-args --params-file /etc/vision-controller.yaml"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
